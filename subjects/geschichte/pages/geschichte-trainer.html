<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geschichte-Trainer</title>
<style>
:root {
  --bg: #F7F8FA; --surface: #FFFFFF; --surface-2: #F0F2F5;
  --border: #E4E7EC; --border-strong: #D0D5DD;
  --text: #1D2330; --text-2: #667085;
  --primary: #2E3646; --on-primary: #FFFFFF;
  --accent: #7BA696; --accent-soft: #EAF2EE; --on-accent-soft: #2F5446;
  --tint: #6F8FB3; --tint-soft: #E9EFF6;
  --success: #3E8E66; --error: #C8564B;
  --success-bg: rgba(62,142,102,.10); --error-bg: rgba(200,86,75,.08);
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #181B21; --surface-2: #20242B;
    --border: #2A2F37; --border-strong: #3A404A;
    --text: #ECEEF2; --text-2: #9AA1AD;
    --primary: #A9CDBD; --on-primary: #12201A;
    --accent: #8DB8A6; --accent-soft: #1C2A25; --on-accent-soft: #CFE5DA;
    --tint: #8FA9C8; --tint-soft: #1E2733;
    --success: #6CC497; --error: #E8877D;
    --success-bg: rgba(108,196,151,.14); --error-bg: rgba(232,135,125,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #181B21; --surface-2: #20242B;
  --border: #2A2F37; --border-strong: #3A404A;
  --text: #ECEEF2; --text-2: #9AA1AD;
  --primary: #A9CDBD; --on-primary: #12201A;
  --accent: #8DB8A6; --accent-soft: #1C2A25; --on-accent-soft: #CFE5DA;
  --tint: #8FA9C8; --tint-soft: #1E2733;
  --success: #6CC497; --error: #E8877D;
  --success-bg: rgba(108,196,151,.14); --error-bg: rgba(232,135,125,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
main {
  max-width: 680px; margin: 0 auto;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 640px) { main { padding-left: 24px; padding-right: 24px; } }
h1, h2 { letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 26px; line-height: 32px; }
h2 { font-size: 20px; line-height: 28px; }
p { margin: 0; }
.muted { color: var(--text-2); }
.small { font-size: 15px; line-height: 22px; }
.xs { font-size: 13px; line-height: 18px; }
.label { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
button { font: inherit; color: inherit; }
.stack > * + * { margin-top: 16px; }
.rise { animation: rise 320ms var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 50% { transform: scale(1.03); } }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

/* Home */
.intro { margin: 8px 0 24px; }
.intro p { margin-top: 6px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.row {
  width: 100%; min-height: 76px; display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms;
}
.row:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
.row:active { transform: scale(.99); }
.tile {
  flex: none; width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center; background: var(--tint-soft); color: var(--tint);
}
.tile svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.row-text { flex: 1; min-width: 0; }
.row-text strong { display: block; font-weight: 600; }
.row-text span { display: block; color: var(--text-2); font-size: 15px; line-height: 22px; }
.chip {
  flex: none; font-size: 13px; line-height: 18px; padding: 3px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--on-accent-soft); font-weight: 600;
}
.chev { flex: none; width: 18px; height: 18px; color: var(--text-2); fill: none; stroke: currentColor; stroke-width: 1.75; }

/* Session chrome */
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.back {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 6px;
  border: 0; background: none; color: var(--text-2); cursor: pointer; border-radius: 999px;
}
.back:hover { background: var(--surface-2); color: var(--text); }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; }
.top .count { margin-left: auto; color: var(--text-2); font-size: 15px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
.bar i { display: block; height: 100%; background: var(--tint); border-radius: 999px; transition: width 300ms var(--ease); }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
  padding: 24px 20px; box-shadow: var(--shadow);
}
.card h2 { margin-top: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 24px; border-radius: 999px; cursor: pointer;
  border: 1px solid transparent; font-weight: 600;
  transition: transform 120ms var(--ease), background 160ms, border-color 160ms;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-secondary { background: var(--surface); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--border-strong); }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.actions .btn { flex: 1 1 160px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

/* Filter chips */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 20px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-size: 15px;
}
.filter[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

/* Exam questions */
textarea {
  width: 100%; min-height: 120px; margin-top: 16px; padding: 12px 14px; resize: vertical;
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 12px;
}
textarea:focus { outline: none; border-color: var(--primary); }
.points { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.point {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  animation: rise 280ms var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms);
}
.point input { flex: none; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--success); }
.point:has(input:checked) { border-color: var(--success); background: var(--success-bg); }
.hint { margin-top: 12px; }

/* Sorting */
.item {
  min-height: 140px; display: grid; place-items: center; text-align: center;
  font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em;
  animation: rise 300ms var(--ease) both;
}
.item.ok { border-color: var(--success); background: var(--success-bg); animation: pop 300ms var(--ease); }
.item.bad { border-color: var(--error); background: var(--error-bg); animation: shake 320ms var(--ease); }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.cat {
  min-height: 64px; padding: 10px 12px; border-radius: 16px; cursor: pointer; font-weight: 600;
  border: 1px solid var(--border-strong); background: var(--surface); line-height: 22px;
  transition: transform 120ms var(--ease), border-color 160ms;
}
.cat:hover { border-color: var(--primary); }
.cat:active { transform: scale(.98); }
.cat.right { border-color: var(--success); background: var(--success-bg); }
.cat.wrong { border-color: var(--error); background: var(--error-bg); }
.feedback { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 22px; animation: rise 240ms var(--ease) both; }
.feedback.ok { background: var(--success-bg); color: var(--text); }
.feedback.bad { background: var(--error-bg); color: var(--text); }
.feedback strong { color: var(--success); }
.feedback.bad strong { color: var(--error); }

/* Timeline */
.pool, .order { display: grid; gap: 8px; }
.ev {
  width: 100%; min-height: 56px; padding: 10px 14px; text-align: left; cursor: pointer;
  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  display: flex; gap: 12px; align-items: center; line-height: 22px;
  animation: rise 260ms var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms);
}
.ev:hover { border-color: var(--border-strong); }
.ev .n {
  flex: none; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 700;
}
.order .ev .n { background: var(--tint-soft); color: var(--tint); }
.ev .yr { margin-left: auto; font-weight: 700; color: var(--text-2); font-size: 15px; white-space: nowrap; }
.ev.ok { border-color: var(--success); background: var(--success-bg); }
.ev.bad { border-color: var(--error); background: var(--error-bg); }
.empty { padding: 14px; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-2); font-size: 15px; text-align: center; }

/* Gap text */
.gaptext { font-size: 18px; line-height: 36px; }
.gap {
  display: inline-block; min-width: 92px; min-height: 32px; margin: 0 2px; padding: 0 10px;
  border: 0; border-bottom: 2px solid var(--border-strong); border-radius: 6px 6px 0 0;
  background: var(--surface-2); cursor: pointer; line-height: 32px; vertical-align: baseline;
  font-weight: 600;
}
.gap.sel { border-bottom-color: var(--primary); background: var(--tint-soft); }
.gap.ok { border-bottom-color: var(--success); background: var(--success-bg); }
.gap.bad { border-bottom-color: var(--error); background: var(--error-bg); }
.gap .fix { display: block; font-size: 13px; line-height: 16px; color: var(--success); font-weight: 600; padding-bottom: 2px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.word {
  min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-size: 16px;
  transition: opacity 160ms, transform 120ms var(--ease);
}
.word:active { transform: scale(.97); }
.word.used { opacity: .3; pointer-events: none; }

/* Results */
.score { font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -0.03em; }
.review { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.review li { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 15px; line-height: 22px; }
.review li b { display: block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

  // ---------- Helpers ----------

  // ---------- Prüfungsfragen ----------
  var examFilter = -1;
  function examStart() {
    var list = shuffle(EXAM.filter(function (q) { return examFilter < 0 || q[0] === examFilter; }));
    if (examFilter < 0) list = list.slice(0, 8);
    var i = 0, got = 0, max = 0;
    function filters() {
      return '<div class="filters" role="group" aria-label="Stoffgebiet">' +
        [["Gemischt (8)", -1]].concat(TOPICS.map(function (t, n) { return [t, n]; })).map(function (f) {
          return '<button type="button" class="filter" data-f="' + f[1] + '" aria-pressed="' + (examFilter === f[1]) + '">' + esc(f[0]) + "</button>";
        }).join("") + "</div>";
    }
    function draw() {
      if (i >= list.length) return done();
      var q = list[i];
      show(top("Prüfungsfragen", (i + 1) + " von " + list.length) + bar(i, list.length) + (i === 0 ? filters() : "") +
        '<div class="card rise"><p class="label">' + esc(TOPICS[q[0]]) + "</p><h2>" + esc(q[1]) + "</h2>" +
        '<textarea id="ans" placeholder="Deine Antwort in Stichworten (freiwillig)" aria-label="Deine Antwort"></textarea>' +
        '<div id="sol"></div></div><div class="actions"><button type="button" class="btn btn-primary" id="go">Lösung zeigen</button></div>');
      app.querySelectorAll("[data-f]").forEach(function (b) {
        b.onclick = function () { examFilter = Number(b.dataset.f); examStart(); };
      });
      app.querySelector("#go").onclick = reveal;
    }
    function reveal() {
      var q = list[i];
      app.querySelector("#sol").innerHTML = '<p class="label" style="margin-top:20px">Musterlösung · tippe an, was du hattest</p><ul class="points">' +
        q[2].map(function (p, n) { return '<li><label class="point" style="--i:' + n + '"><input type="checkbox"><span>' + esc(p) + "</span></label></li>"; }).join("") + "</ul>";
      var go = app.querySelector("#go");
      go.textContent = i + 1 < list.length ? "Weiter" : "Zum Ergebnis";
      go.onclick = function () {
        got += app.querySelectorAll(".point input:checked").length; max += q[2].length; i++; draw();
      };
    }
    function done() {
      save("exam", got + "/" + max);
      show(top("Prüfungsfragen") + '<div class="card rise"><p class="label">Ergebnis</p><p class="score">' + got + "<span class=\"muted\" style=\"font-size:26px\"> / " + max + "</span></p>" +
        '<p class="muted small" style="margin-top:8px">Punkte aus der Musterlösung, die du genannt hast. Im Test zählen ganze Sätze mit Begründung.</p></div>' +
        '<div class="actions"><button type="button" class="btn btn-primary" id="again">Neue Runde</button><button type="button" class="btn btn-secondary" data-home2>Fertig</button></div>');
      app.querySelector("#again").onclick = examStart;
      app.querySelector("[data-home2]").onclick = home;
    }
    draw();
  }

  // ---------- Zuordnen ----------
  function sortStart() {
    show(top("Zuordnen") + '<ul class="rows">' + SORTS.map(function (s, n) {
      return '<li class="rise" style="--i:' + n + '"><button type="button" class="row" data-s="' + n + '"><span class="row-text"><strong>' + esc(s.name) + "</strong><span>" + esc(s.sub) + " · " + s.items.length + " Begriffe</span></span>" + I.chev + "</button></li>";
    }).join("") + "</ul>");
    app.querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () { sortRun(SORTS[Number(b.dataset.s)]); }; });
  }
  function sortRun(set) {
    var items = shuffle(set.items), i = 0, right = 0, wrong = [];
    function draw() {
      if (i >= items.length) return done();
      var it = items[i];
      show(top(set.name, (i + 1) + " von " + items.length) + bar(i, items.length) +
        '<div class="card item" id="it">' + esc(it[0]) + "</div>" +
        '<div class="cats">' + set.cats.map(function (c, n) { return '<button type="button" class="cat" data-c="' + n + '">' + esc(c) + "</button>"; }).join("") + "</div>" +
        '<div id="fb"></div><div class="actions" id="act"></div>');
      app.querySelectorAll("[data-c]").forEach(function (b) {
        b.onclick = function () {
          var pick = Number(b.dataset.c), ok = pick === it[1];
          app.querySelectorAll("[data-c]").forEach(function (x) { x.disabled = true; });
          app.querySelector('[data-c="' + it[1] + '"]').classList.add("right");
          if (!ok) { b.classList.add("wrong"); wrong.push(it); } else right++;
          app.querySelector("#it").classList.add(ok ? "ok" : "bad");
          app.querySelector("#fb").innerHTML = '<div class="feedback ' + (ok ? "ok" : "bad") + '"><strong>' + (ok ? "Richtig!" : "Leider falsch.") + "</strong> " +
            esc(it[0]) + " gehört zu „" + esc(set.cats[it[1]]) + "“.</div>";
          var act = app.querySelector("#act");
          act.innerHTML = '<button type="button" class="btn btn-primary">' + (i + 1 < items.length ? "Weiter" : "Zum Ergebnis") + "</button>";
          var nx = act.firstChild; nx.focus(); nx.onclick = function () { i++; draw(); };
        };
      });
    }
    function done() {
      save("sort", right + "/" + items.length);
      show(top(set.name) + '<div class="card rise"><p class="label">Ergebnis</p><p class="score">' + right + '<span class="muted" style="font-size:26px"> / ' + items.length + "</span></p></div>" +
        (wrong.length ? '<p class="label" style="margin-top:24px">Noch üben</p><ul class="review">' + wrong.map(function (w) { return "<li><b>" + esc(w[0]) + "</b>" + esc(set.cats[w[1]]) + "</li>"; }).join("") + "</ul>" : "") +
        '<div class="actions"><button type="button" class="btn btn-primary" id="again">Nochmal</button><button type="button" class="btn btn-secondary" id="other">Anderes Thema</button></div>');
      app.querySelector("#again").onclick = function () { sortRun(set); };
      app.querySelector("#other").onclick = sortStart;
    }
    draw();
  }

  function timeRun() {
    var round = shuffle(EVENTS).slice(0, 5), placed = [], checked = false;
    var sorted = round.slice().sort(function (a, b) { return a[0] - b[0]; });

      show(top("Zeitleiste", "Runde " + (timeRound + 1)) +

        '<p class="label">Deine Reihenfolge</p><div class="order" style="margin:8px 0 20px">' +
        (placed.length ? placed.map(function (e, n) {
          var cls = checked ? (e === sorted[n] ? " ok" : " bad") : "";
          return '<button type="button" class="ev' + cls + '" data-p="' + n + '"' + (checked ? " disabled" : "") + '><span class="n">' + (n + 1) + "</span><span>" + esc(e[2]) + "</span>" + (checked ? '<span class="yr">' + esc(e[1]) + "</span>" : "") + "</button>";
        }).join("") : '<div class="empty">Noch leer</div>') + "</div>" +
        (pool.length ? '<p class="label">Ereignisse</p><div class="pool" style="margin-top:8px">' + pool.map(function (e, n) {
          return '<button type="button" class="ev" style="--i:' + n + '" data-e="' + round.indexOf(e) + '"><span class="n">·</span><span>' + esc(e[2]) + "</span></button>";
        }).join("") + "</div>" : "") +
        (checked ? solution() : "") +
        '<div class="actions">' + (checked
          ? '<button type="button" class="btn btn-primary" id="next">Neue Runde</button><button type="button" class="btn btn-secondary" data-home2>Fertig</button>'
          : '<button type="button" class="btn btn-primary" id="check"' + (pool.length ? " disabled" : "") + ">Prüfen</button>") + "</div>");
      app.querySelectorAll("[data-e]").forEach(function (b) { b.onclick = function () { placed.push(round[Number(b.dataset.e)]); draw(); }; });
      app.querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { placed.splice(Number(b.dataset.p), 1); draw(); }; });
      var c = app.querySelector("#check"); if (c) c.onclick = function () {
        checked = true; var ok = placed.every(function (e, n) { return e === sorted[n]; });
        timeRound++; if (ok) timeRight++; save("time", timeRight + "/" + timeRound); draw();
      };
      var nx = app.querySelector("#next"); if (nx) nx.onclick = timeRun;
      var h2 = app.querySelector("[data-home2]"); if (h2) h2.onclick = home;
    }
    function solution() {
      var ok = placed.every(function (e, n) { return e === sorted[n]; });
      return '<div class="feedback ' + (ok ? "ok" : "bad") + '"><strong>' + (ok ? "Alles richtig!" : "Nicht ganz.") + "</strong> " +
        (ok ? "" : "Richtig ist: " + sorted.map(function (e) { return esc(e[1]) + " " + esc(e[2]); }).join(" → ")) + "</div>";
    }
    draw();
  }

  // ---------- Lückentext ----------
  function gapStart() {
    var st = load();
    show(top("Lückentext") + '<ul class="rows">' + GAPS.map(function (g, n) {
      var k = (g.text.match(/\[/g) || []).length;
      return '<li class="rise" style="--i:' + n + '"><button type="button" class="row" data-g="' + n + '"><span class="row-text"><strong>' + esc(g.name) + "</strong><span>" + k + " Lücken</span></span>" +
        (st["gap" + n] ? '<span class="chip">' + st["gap" + n] + "</span>" : "") + I.chev + "</button></li>";
    }).join("") + "</ul>");
    app.querySelectorAll("[data-g]").forEach(function (b) { b.onclick = function () { gapRun(Number(b.dataset.g)); }; });
  }
  function gapRun(idx) {
    var g = GAPS[idx], parts = g.text.split(/\[([^\]]+)\]/), answers = [], fill = [], sel = 0, checked = false;
    for (var p = 1; p < parts.length; p += 2) { answers.push(parts[p]); fill.push(null); }
    var bank = shuffle(answers.map(function (a, n) { return { w: a, n: n }; }));
    function draw() {
      var html = "", k = 0;
      parts.forEach(function (part, n) {
        if (n % 2 === 0) { html += esc(part); return; }
        var f = fill[k], cls = checked ? (f !== null && bank[f].w === answers[k] ? " ok" : " bad") : (k === sel ? " sel" : "");
        html += '<button type="button" class="gap' + cls + '" data-k="' + k + '" aria-label="Lücke ' + (k + 1) + '">' +
          (checked && !(f !== null && bank[f].w === answers[k]) ? '<span class="fix">' + esc(answers[k]) + "</span>" : "") +
          (f !== null ? esc(bank[f].w) : "&nbsp;") + "</button>";
        k++;
      });
      var correct = fill.filter(function (f, n) { return f !== null && bank[f].w === answers[n]; }).length;
      show(top(g.name) + '<div class="card rise"><p class="gaptext">' + html + "</p></div>" +
        (checked ? '<div class="feedback ' + (correct === answers.length ? "ok" : "bad") + '"><strong>' + correct + " von " + answers.length + " richtig.</strong> " +
          (correct === answers.length ? "Sehr gut!" : "Die richtigen Begriffe stehen grün über den falschen Lücken.") + "</div>"
          : '<div class="bank" role="group" aria-label="Begriffe">' + bank.map(function (b, n) {
            return '<button type="button" class="word' + (fill.indexOf(n) >= 0 ? " used" : "") + '" data-w="' + n + '">' + esc(b.w) + "</button>";
          }).join("") + "</div>") +
        '<div class="actions">' + (checked
          ? '<button type="button" class="btn btn-primary" id="again">Nochmal</button><button type="button" class="btn btn-secondary" id="other">Anderer Text</button>'
          : '<button type="button" class="btn btn-primary" id="check"' + (fill.indexOf(null) >= 0 ? " disabled" : "") + ">Prüfen</button>") + "</div>");
      if (!checked) {
        app.querySelectorAll("[data-k]").forEach(function (b) {
          b.onclick = function () { var k2 = Number(b.dataset.k); if (fill[k2] !== null) fill[k2] = null; sel = k2; draw(); };
        });
        app.querySelectorAll("[data-w]").forEach(function (b) {
          b.onclick = function () {
            if (fill[sel] !== null) sel = fill.indexOf(null);
            if (sel < 0) return;
            fill[sel] = Number(b.dataset.w);
            var next = fill.indexOf(null, sel); sel = next >= 0 ? next : fill.indexOf(null);
            draw();
          };
        });
        app.querySelector("#check").onclick = function () { checked = true; draw(); save("gap" + idx, correct2() + "/" + answers.length); save("gap", correct2() + "/" + answers.length); };
      } else {
        app.querySelector("#again").onclick = function () { gapRun(idx); };
        app.querySelector("#other").onclick = gapStart;
      }
    }
    function correct2() { return fill.filter(function (f, n) { return f !== null && bank[f].w === answers[n]; }).length; }
    draw();
  }

  home();
})();
</script>
</body>
</html>
