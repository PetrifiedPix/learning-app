@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--cd:#292524;--tx:#f3ece4;--mu:#a8998b;--ac:#ff7a5c;--ok:#5fd18a;--no:#ff7b6e;--bd:#44403c}}
:root[data-theme="dark"]{--bg:#1c1917;--cd:#292524;--tx:#f3ece4;--mu:#a8998b;--ac:#ff7a5c;--ok:#5fd18a;--no:#ff7b6e;--bd:#44403c}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

h1{font-size:22px;margin:4px 0 2px}.sub,.pr{color:var(--mu);font-size:14px}.pr{margin:12px 0 6px}
.b,select{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.b.p,.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}.t{display:block;width:100%;text-align:left;margin:6px 0}select{width:100%}
.row{display:flex;gap:8px;margin:6px 0}.row .b{flex:1;text-align:center;padding:10px 6px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}

.lb{color:var(--mu);font-size:13px}.wd{font-size:26px;font-weight:600;margin:8px 0;overflow-wrap:anywhere}.q{font-size:21px;margin-bottom:12px;font-weight:600;overflow-wrap:anywhere}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.ch{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:10px 0}.ch .b{padding:8px 0;text-align:center;font-size:18px}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}.tip{background:var(--bg);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:14px}
li{margin:3px 0}@media(max-width:480px){#app{padding-top:10px;padding-bottom:28px}.wd{font-size:24px}}

function start(m){fm=m=='f';mode=fm?'t':m;lastM=m;const p=fm?sh(wl()):build();if(!p.length){alert(fm?'Noch keine Fehler gesammelt.':'Keine Wörter ausgewählt.');return}
Q=p.map(w=>({w,d:S.dir=='mix'?(Math.random()<.5?'es':'de'):S.dir}));i=0;sc=0;miss=[];flip=false;show()}
function say(){try{const u=new SpeechSynthesisUtterance(Q[i].w.es.replace(/\(.*?\)/g,'').split(' / ')[0].replace(/\/-\w+/g,'').replace(/[¿¡]/g,''));u.lang='es-ES';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function fl(){flip=true;show()}
const tag=w=>`Alegría ${w.b} · U${w.u}`;
function show(){
if(i>=Q.length)return end();const q=Q[i],fr=q.d=='es'?q.w.es:q.w.de,bk=q.d=='es'?q.w.de:q.w.es;
let h=`<button class=b onclick="home()">✕ Beenden</button><div class=pr>${mode=='k'?'Noch '+(Q.length-i)+' Karten':(i+1)+' / '+Q.length} · ${tag(q.w)}</div>`;
if(mode=='k'){h+=`<div class=fc onclick="fl()"><div class=lb>${flip?(q.d=='es'?'Deutsch':'Español'):(q.d=='es'?'Español':'Deutsch')}</div><div class=wd>${flip?bk:fr}</div>${flip?'':'<div class=lb>Tippen zum Umdrehen</div>'}</div><button class=b onclick="say()">🔊 Anhören</button>`;
if(flip)h+=`<div class=row><button class=b onclick="kn(0)">✗ Noch nicht</button><button class="b p" onclick="kn(1)">✓ Gewusst</button></div>`}
else{h+=`<div class=card><div class=lb>${q.d=='es'?'Was heißt das auf Deutsch?':'Wie heißt das auf Spanisch?'}</div><div class=q>${fr}</div>`;
if(mode=='m'){const o=sh([...new Set(sh(D).map(w=>q.d=='es'?w.de:w.es).filter(x=>x!=bk))]).slice(0,3);h+=sh([bk,...o]).map(x=>`<button class="b t" onclick="ck(this.textContent)">${x}</button>`).join('')}
else h+=`<input type=text id=in autocomplete=off autocapitalize=off spellcheck=false onkeydown="if(event.key=='Enter')ck(this.value)"><div class=ch>${['á','é','í','ó','ú','ñ','¿','¡'].map(c=>`<button class=b onclick="ins('${c}')">${c}</button>`).join('')}</div><button class="b p t" style="text-align:center" onclick="ck($('#in').value)">Prüfen</button><button class="b t" style="text-align:center" onclick="ck('')">Weiß ich nicht</button>`;h+='</div>'}
$('#app').innerHTML=h;const e=$('#in');if(e){e.focus({preventScroll:true});e.scrollIntoView({block:'center'})}}
function ins(c){const e=$('#in');e.value+=c;e.focus()}
function kn(ok){const q=Q[i];if(ok){sc++}else{miss.push(q.w);WR.add(K(q.w));Q.push({w:q.w,d:q.d})}save();i++;flip=false;show()}
function ck(v){const q=Q[i],fr=q.d=='es'?q.w.es:q.w.de,bk=q.d=='es'?q.w.de:q.w.es;
const a=alts(bk),u=alts(v);const ok=mode=='m'?v==bk:(u.length>0&&u.every(x=>a.includes(x)));
if(ok){sc++;if(fm)WR.delete(K(q.w))}else{miss.push(q.w);WR.add(K(q.w))}save();
$('#app').innerHTML=`<div class=pr>${i+1} / ${Q.length} · ${tag(q.w)}</div><div class=card><div class=q>${fr}</div><div class="${ok?'ok':'no'}">${ok?'✓ Richtig!':'✗ Leider falsch.'}</div><div style="margin:8px 0">Richtig: <b>${bk}</b></div>${q.w.bi?'<div class=lb>🖼️ Bildwort: Übersetzung ergänzt</div>':''}<br><button class=b onclick="say()">🔊 Anhören</button> <button class="b p" onclick="i++;show()">Weiter →</button></div>`}
function end(){const u=[...new Set(miss)];
$('#app').innerHTML=`<h1>${mode=='k'?'🎉 Alle Karten geschafft!':'Ergebnis: '+sc+' / '+Q.length}</h1><div class=card>${mode=='k'?(u.length?u.length+' Wörter brauchten eine Wiederholung.':'Alles auf Anhieb gewusst!'):(u.length?'Das übst du am besten nochmal:':'Perfekt, alles richtig! 🎉')}${u.length?'<ul>'+u.map(w=>`<li><b>${w.es}</b> = ${w.de} <span class=lb>(${tag(w)})</span></li>`).join('')+'</ul>':''}</div>${lastM!='f'?`<button class="b p" onclick="start('${lastM}')">▶ Nächste Runde</button> `:''}<button class=b onclick="home()">Zum Menü</button> ${WR.size?'<button class=b onclick="start(\'f\')">🔁 Fehler üben ('+WR.size+')</button>':''}`}
home();
</script></body></html>
