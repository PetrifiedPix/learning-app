.tip{background:var(--bg);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:15px}li{margin:3px 0}.card>.b.p{width:100%;min-height:50px;font-size:17px;margin-top:4px}@media(max-width:480px){#app{padding-top:10px;padding-bottom:28px}h1{font-size:20px}.card{padding:14px;border-radius:12px}.q{font-size:18px;line-height:1.45}td{padding:4px 6px;font-size:13px}.t{padding:13px 14px}.tabs button{padding:10px 12px;font-size:15px}.tip{font-size:14px}}
</style></head><body><div id="app"></div><script>

{n:'Reflexive Verben',tip:'Reflexivpronomen: me, te, se, nos, os, se – steht vor dem Verb.',

{n:'gustar, encantar, interesar, apetecer, parecer, molestar',tip:'Verb richtet sich nach dem Gegenstand: Singular/Infinitiv → -a, Plural → -an. Pronomen: me, te, le, nos, os, les.',

q:[['A mí ___ (gustar) los gatos.','me gustan'],['A ti ___ (encantar) el chocolate.','te encanta'],['A nosotros ___ (interesar) la historia.','nos interesa'],['A ella ___ (molestar) el ruido.','le molesta'],['A ellos ___ (gustar) bailar.','les gusta'],['A vosotros ___ (apetecer) un helado.','os apetece'],['A mí ___ (parecer) interesantes las clases.','me parecen'],['A ti ___ (gustar) las películas.','te gustan']]},
{n:'ir / venir / llevar / traer',tip:'ir/llevar = vom Sprecher weg · venir/traer = zum Sprecher hin',

q:[['Yo ___ al cine. (hin)','voy',['voy','vengo']],['¡___ aquí, por favor! (zu mir)','Ven',['Ve','Ven']],['Voy a tu fiesta y ___ una tarta. (dorthin)','llevo',['llevo','traigo']],['Mañana (tú) ___ el libro a clase. (Sprecher ist in der Klasse)','traes',['llevas','traes']],['¿___ conmigo al cine? (du kommst)','Vienes',['Vas','Vienes']],['Mi madre ___ al mercado. (weg)','va',['va','viene']]]},
{n:'Futuro inmediato (ir a + Infinitiv)',tip:'ir (voy, vas, va, vamos, vais, van) + a + Infinitiv',

{n:'estar + gerundio',tip:'-ar → -ando · -er/-ir → -iendo · Sonderfälle: leer → leyendo, dormir → durmiendo, decir → diciendo, pedir → pidiendo',

q:[['Estoy ___ (estudiar).','estudiando'],['Ella está ___ (comer).','comiendo'],['Estamos ___ (escribir).','escribiendo'],['Ellos están ___ (dormir).','durmiendo'],['¿Qué estás ___ (hacer)?','haciendo'],['Él está ___ (leer).','leyendo'],['Estoy ___ (decir) la verdad.','diciendo']]},
{n:'Indefinido (Vergangenheit)',tip:'Signalwörter: ayer, anoche, el año pasado, la semana pasada, hace dos días',

q:[['Ayer yo ___ (hablar) con Ana.','hablé'],['Ella ___ (comer) paella.','comió'],['Nosotros ___ (vivir) en Graz.','vivimos'],['Ayer yo ___ (ir) al cine.','fui'],['Tú ___ (hacer) los deberes.','hiciste'],['Ellos ___ (tener) un problema.','tuvieron'],['Él ___ (decir) la verdad.','dijo'],['Yo ___ (estar) en Madrid.','estuve'],['Vosotros ___ (ver) la peli.','visteis'],['Ella ___ (dar) un regalo.','dio'],['Anoche ___ (nosotros, ser) felices.','fuimos'],['Ayer yo ___ (poder) venir.','pude'],['La semana pasada ellos ___ (venir) a casa.','vinieron'],['¿___ (tú, comer) ayer en el cole?','Comiste']]},
{n:'Pronomen: Subjekt & Possessiv',tip:'Possessiv richtet sich nach dem Besitz: mi/mis, tu/tus, su/sus, nuestro/-a/-os/-as, vuestro/-a/-os/-as',

{n:'Pronomen: direktes & indirektes Objekt',tip:'OD (wen/was?): me, te, lo/la, nos, os, los/las · OI (wem?): me, te, le, nos, os, les · Steht vor dem Verb.',

q:[['Veo el libro. → ___ veo.','Lo'],['Compro las flores. → ___ compro.','Las'],['Ana come la manzana. → Ana ___ come.','la'],['¿Ves a Juan? Sí, ___ veo.','lo'],['Tengo los zapatos. → ___ tengo.','Los'],['Doy un regalo a mi madre. → ___ doy un regalo.','Le'],['Escribo a mis amigos. → ___ escribo.','Les'],['Ella da un libro a nosotros. → Ella ___ da un libro.','nos']]},

let h='<h1>🇪🇸 Spanisch-SA Training</h1><div class=sub>Prüfung: Freitag, 13. November · Lernen → Üben → Prüfung</div><div class=tabs>'+tb.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('')+'</div>';

:'<div class=card><b>🤖 Unendlich neue Sätze</b><p>Claude schreibt bei jedem Start frische Übungssätze mit neuen Wörtern und Themen. Wähle ein Thema (8 Sätze pro Runde, danach gibt es neue).</p><button class="b p t" onclick="gen(-1)">🎲 Alle Themen gemischt</button></div>')+T.map((t,k)=>`<button class="b t" onclick="gen(${k})">${k+1}. ${t.n}</button>`).join('');

function run(q,t,e,f,k){aiK=null;lk=null;Q=q;ttl=t;exam=!!e;fm=!!f;i=0;sc=0;miss=[];if(!Q.length)return home();show()}

if(exam){i++;return show()}
$('#app').innerHTML=`<div class=pr>${ttl} · ${i+1}/${Q.length}</div><div class=card><div class=q>${q.p}</div><div class="${ok?'ok':'no'}">${ok?'✓ Richtig!':'✗ Leider falsch.'} Richtig: <b>${al[0]}</b></div>${acc?'<div class=tip>Achtung Akzent! Schreib es so: <b>'+al[0]+'</b></div>':''}${ok?'':'<div class=tip>'+q.tip+'</div>'}<br><button class="b p" onclick="i++;show()">Weiter →</button></div>`}
function end(){
const p=Math.round(100*sc/Q.length);
$('#app').innerHTML=`<h1>Ergebnis: ${sc}/${Q.length} (${p}%)</h1><div class=card>${p>=90?'🎉 Sehr gut!':p>=70?'👍 Gut, noch ein bisschen Feinschliff.':'💪 Lies das Thema nochmal und versuch es erneut.'}</div>`+(miss.length?'<div class=card><b>Das solltest du wiederholen:</b><ul>'+miss.map(q=>`<li>${q.p} → <b>${q.a.split('|')[0]}</b> <span class=pr>(${q.n})</span></li>`).join('')+'</ul></div>':'')+(lk!==null?'<button class="b p" onclick="genL(lk)">🎲 10 neue Sätze</button> ':'')+(aiK!==null?'<button class="b p" onclick="gen(aiK)">🤖 8 neue Sätze</button> ':'')+'<button class="b p" onclick="home()">Zum Menü</button> '+(miss.length&&!fm?'<button class=b onclick="tab=\'f\';home()">Fehler üben</button>':'')}
function mail(){return `<div class=card><b>Correo electrónico informal (Buch S. 34–35, 136)</b><ul><li><b>Anrede:</b> ¡Hola, Ana! · Querido Pablo: · Querida Laura:</li><li><b>Einstieg:</b> ¿Qué tal? · ¿Cómo estás? · Gracias por tu correo.</li><li><b>Anlass:</b> Te escribo para… · Quiero contarte que…</li><li><b>Erzählen:</b> Ayer fui… (indefinido) · Ahora estoy… (gerundio) · Mañana voy a… (futuro inmediato)</li><li><b>Vorlieben:</b> Me encanta… · Me gusta… · No me gustan…</li><li><b>Fragen:</b> ¿Y tú? ¿Qué haces? ¿Puedes venir?</li><li><b>Schluss:</b> Un abrazo · Besos · Hasta pronto · Escríbeme pronto</li></ul><div class=tip><b>Checkliste:</b> Anrede ✓ Gruß ✓ alle Inhaltspunkte der Aufgabe ✓ mindestens ein Satz in der Vergangenheit, einer im Präsens, einer im Futuro ✓ Frage an den Freund ✓ Akzente ✓ Wortanzahl ✓</div><b>Muster:</b><br><i>¡Hola, Ana!<br>¿Qué tal? Gracias por tu correo. Te escribo para contarte mi fin de semana. Ayer fui al cine con mis amigos y vimos una peli muy divertida. Ahora estoy estudiando para el examen de español, pero mañana voy a jugar al fútbol. Me encanta el deporte. ¿Y tú? ¿Qué haces los fines de semana?<br>Un abrazo, Max</i></div>`}
home();
</script></body></html>
